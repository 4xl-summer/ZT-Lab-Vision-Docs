name: HTML Manual QA
on:
  push:
    paths:
      - 'manual-next/**'
      - '.github/workflows/html-manual-qa.yml'
  pull_request:
    paths:
      - 'manual-next/**'
      - '.github/workflows/html-manual-qa.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node manual-next/scripts/validate.cjs
      - run: python3 manual-next/scripts/check_content.py
      - run: python3 manual-next/scripts/check_topics.py
      - run: python3 manual-next/scripts/check_visuals.py
