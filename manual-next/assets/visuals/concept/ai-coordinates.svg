<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="22" fill="#182d45"><text x="30" y="38" font-size="26" font-weight="bold" fill="#182d45">기본 AI 입력: 축별 stretch와 박스 역대응</text><text x="50" y="82" font-size="22" font-weight="normal" fill="#182d45">입력 ROI 100 × 50</text><rect x="50" y="105" width="360" height="180" fill="#eff6fa" stroke="#6086a7" stroke-width="2"/><rect x="122" y="141" width="144" height="72" fill="none" stroke="#d46632" stroke-width="2"/><text x="60" y="320" font-size="20" font-weight="normal" fill="#182d45">ROI 로컬 박스</text><text x="60" y="350" font-size="21" font-weight="normal" fill="#182d45">(20,10) – (60,30)</text><text x="560" y="82" font-size="22" font-weight="normal" fill="#182d45">모델 입력 200 × 200</text><rect x="560" y="105" width="180" height="180" fill="#eff6fa" stroke="#6086a7" stroke-width="2"/><rect x="596" y="141" width="72" height="72" fill="none" stroke="#d46632" stroke-width="2"/><text x="555" y="320" font-size="20" font-weight="normal" fill="#182d45">모델 박스</text><text x="555" y="350" font-size="21" font-weight="normal" fill="#182d45">(40,40) – (120,120)</text><text x="50" y="410" font-size="20" font-weight="normal" fill="#182d45">X는 ×2, Y는 ×4로 늘립니다. 박스를 되돌릴 때는 각 배율로 나눕니다.</text><text x="50" y="442" font-size="20" font-weight="normal" fill="#182d45">ROI 원점이 (10,20)이면 원본 뷰 결과는 (30,30) – (70,50)입니다.</text><text x="50" y="474" font-size="20" font-weight="normal" fill="#182d45">설명용 좌표 · 기본 AiEngine은 letterbox를 적용하지 않습니다.</text></g></svg>