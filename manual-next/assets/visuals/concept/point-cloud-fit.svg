<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="22" fill="#182d45"><text x="30" y="38" font-size="26" font-weight="bold" fill="#182d45">점과 평면의 잔차 — 설명용 수치</text><polygon points="100,310 650,310 825,210 275,210" fill="#e6f3f7" stroke="#51869a" stroke-width="2"/><text x="110" y="350" font-size="21" font-weight="normal" fill="#182d45">평면 z = 0</text><text x="35" y="410" font-size="21" font-weight="normal" fill="#182d45">색 선의 길이는 평면까지의 수직 거리입니다.</text><line x1="230" y1="233" x2="230" y2="260" stroke="#d46632" stroke-width="2" stroke-dasharray="6 4"/><circle cx="230" cy="233" r="7" fill="#d46632"/><circle cx="230" cy="260" r="4" fill="#51869a"/><text x="239" y="225" font-size="20" font-weight="normal" fill="#182d45">z=1</text><line x1="430" y1="206" x2="430" y2="260" stroke="#d46632" stroke-width="2" stroke-dasharray="6 4"/><circle cx="430" cy="206" r="7" fill="#d46632"/><circle cx="430" cy="260" r="4" fill="#51869a"/><text x="439" y="198" font-size="20" font-weight="normal" fill="#182d45">z=2</text><line x1="620" y1="169" x2="620" y2="250" stroke="#d46632" stroke-width="2" stroke-dasharray="6 4"/><circle cx="620" cy="169" r="7" fill="#d46632"/><circle cx="620" cy="250" r="4" fill="#51869a"/><text x="629" y="161" font-size="20" font-weight="normal" fill="#182d45">z=3</text><text x="680" y="115" font-size="21" font-weight="normal" fill="#182d45">잔차 거리</text><text x="680" y="145" font-size="21" font-weight="normal" fill="#182d45">1, 2, 3 단위</text><text x="680" y="180" font-size="21" font-weight="normal" fill="#182d45">RMS = √(14/3) ≈ 2.16</text></g></svg>