<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="22" fill="#182d45"><text x="30" y="38" font-size="26" font-weight="bold" fill="#182d45">ROI 로컬 → 전역 픽셀 → 평면 좌표</text><rect x="45" y="90" width="360" height="270" fill="#f8fbfd" stroke="#6086a7" stroke-width="2"/><line x1="45" y1="90" x2="45" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="90" y1="90" x2="90" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="135" y1="90" x2="135" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="180" y1="90" x2="180" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="225" y1="90" x2="225" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="270" y1="90" x2="270" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="315" y1="90" x2="315" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="360" y1="90" x2="360" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="405" y1="90" x2="405" y2="360" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="90" x2="405" y2="90" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="135" x2="405" y2="135" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="180" x2="405" y2="180" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="225" x2="405" y2="225" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="270" x2="405" y2="270" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="315" x2="405" y2="315" stroke="#d1e0eb" stroke-width="2"/><line x1="45" y1="360" x2="405" y2="360" stroke="#d1e0eb" stroke-width="2"/><rect x="135" y="180" width="180" height="135" fill="none" stroke="#d46632" stroke-width="2"/><circle cx="180" cy="225" r="5" fill="#d46632"/><text x="140" y="170" font-size="19" font-weight="normal" fill="#182d45">ROI 원점 (100,200)</text><text x="185" y="250" font-size="19" font-weight="normal" fill="#182d45">로컬 (10,20)</text><text x="485" y="120" font-size="23" font-weight="normal" fill="#182d45">전역 = ROI 원점 + 로컬</text><text x="485" y="160" font-size="22" font-weight="normal" fill="#182d45">(100,200) + (10,20)</text><text x="485" y="200" font-size="23" font-weight="normal" fill="#a64720">= (110,220) 픽셀</text><text x="485" y="260" font-size="22" font-weight="normal" fill="#182d45">평면 좌표 = 보정 변환(전역 점)</text><text x="485" y="300" font-size="20" font-weight="normal" fill="#182d45">단위와 결과는 보정 모델에 따릅니다.</text><text x="45" y="405" font-size="20" font-weight="normal" fill="#182d45">격자와 위치는 좌표의 관계를 보여 주는 설명용 도해입니다.</text></g></svg>