<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><rect width="100%" height="100%" fill="white"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><text x="28" y="42" font-size="28" font-weight="bold" fill="#20334a" text-anchor="start">임계값 경계와 연결된 두 픽셀</text><text x="28" y="76" font-size="21" font-weight="normal" fill="#20334a" text-anchor="start">합성 입력 · T = 10 · 비교 p ≥ T</text><text x="32" y="125" font-size="22" font-weight="bold" fill="#20334a" text-anchor="start">입력 Gray8</text><rect x="285" y="88" width="90" height="90" rx="0" fill="#e3e9ef" stroke="#a5b5c5" stroke-width="1"/><text x="330.0" y="147.4" font-size="25" font-weight="bold" fill="#20334a" text-anchor="middle">9</text><rect x="375" y="88" width="90" height="90" rx="0" fill="#e3e9ef" stroke="#a5b5c5" stroke-width="1"/><text x="420.0" y="147.4" font-size="25" font-weight="bold" fill="#20334a" text-anchor="middle">10</text><rect x="465" y="88" width="90" height="90" rx="0" fill="#e3e9ef" stroke="#a5b5c5" stroke-width="1"/><text x="510.0" y="147.4" font-size="25" font-weight="bold" fill="#20334a" text-anchor="middle">11</text><text x="32" y="245" font-size="22" font-weight="bold" fill="#20334a" text-anchor="start">출력 Gray8</text><rect x="285" y="208" width="90" height="90" rx="0" fill="#fff" stroke="#a5b5c5" stroke-width="1"/><rect x="375" y="208" width="90" height="90" rx="0" fill="#1967aa" stroke="#a5b5c5" stroke-width="1"/><rect x="465" y="208" width="90" height="90" rx="0" fill="#1967aa" stroke="#a5b5c5" stroke-width="1"/><text x="330" y="265" font-size="24" font-weight="bold" fill="#20334a" text-anchor="middle">0</text><text x="330" y="328" font-size="20" font-weight="normal" fill="#20334a" text-anchor="middle">x = 0</text><text x="420" y="265" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">255</text><text x="420" y="328" font-size="20" font-weight="normal" fill="#20334a" text-anchor="middle">x = 1</text><text x="510" y="265" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">255</text><text x="510" y="328" font-size="20" font-weight="normal" fill="#20334a" text-anchor="middle">x = 2</text><line x1="420" y1="200" x2="420" y2="170" stroke="#237a52" stroke-width="2" stroke-dasharray="5 4"/><circle cx="465" cy="253" r="6" fill="#dd6b20"/><text x="30" y="383" font-size="24" font-weight="bold" fill="#20334a" text-anchor="start">전경 2개 픽셀: 면적 = 2 픽셀</text><text x="30" y="424" font-size="24" font-weight="normal" fill="#20334a" text-anchor="start">중심 = ((1 + 2) / 2, 0) = (1.5, 0)</text><text x="30" y="465" font-size="20" font-weight="normal" fill="#20334a" text-anchor="start">주황 점은 두 전경 픽셀 중심의 평균입니다.</text></g></svg>